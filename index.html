<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KINAETO — Beneath the Flame</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🜏</text></svg>" />
  <link rel="preload" href="vendor/fonts/uncial-antiqua-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- top bar: floating glowing text, no boxes -->
  <div id="topbar">
    <div class="top-group">
      <div id="hud-turn">Turn 1</div>
      <div id="hud-wave">Wave 0 / 4</div>
    </div>
    <div id="obelisk-wrap">
      <div id="hud-obelisk-text">OBELISK 20 / 20</div>
      <div id="obelisk-bar"><div id="hud-obelisk-fill"></div></div>
      <div id="hud-gaze"></div>
    </div>
    <div class="top-group right">
      <div id="hud-deck">Deck 0</div>
      <div id="hud-discard">Discard 0</div>
    </div>
  </div>

  <!-- resources: Impetus flames + the single Kinaetic focus -->
  <div id="resources">
    <div id="impetus-label">IMPETUS</div>
    <div id="hud-impetus"></div>
    <div id="kinaetic-wrap" title="Kinaetic focus — one reach of the hand per turn">
      <svg id="hud-kinaetic" viewBox="0 0 64 40" width="58" height="36">
        <path d="M4 20 Q32 -6 60 20 Q32 46 4 20 Z" fill="none" stroke="currentColor" stroke-width="3"/>
        <circle cx="32" cy="20" r="9" fill="currentColor"/>
        <circle cx="32" cy="20" r="3.5" fill="#050208"/>
      </svg>
      <div id="kinaetic-label">KINAETIC</div>
    </div>
  </div>
  <button id="btn-endturn">END TURN</button>

  <!-- transient messaging -->
  <div id="banner"></div>
  <div id="toast"></div>
  <div id="hint"></div>

  <!-- Kinaeto dialogue -->
  <div id="dialogue">
    <div id="dialogue-name">◉ KINAETO</div>
    <div id="dialogue-text"></div>
    <div id="dialogue-more">click or space to continue</div>
  </div>

  <!-- hub panels: card altar / smith forge / the war map -->
  <div id="panel"></div>

  <!-- the Inquisitor's Judgement: a blinding burst of holy light -->
  <div id="flash"></div>

  <!-- the dream: the only room they cannot burn -->
  <div id="dream">
    <div id="dream-eye">
      <svg viewBox="0 0 64 40" width="120" height="76">
        <path d="M4 20 Q32 -6 60 20 Q32 46 4 20 Z" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <circle cx="32" cy="20" r="9" fill="currentColor"/>
        <circle cx="32" cy="20" r="3.5" fill="#050208"/>
      </svg>
    </div>
    <div id="dream-name">◉ KINAETO — IN THE DREAM</div>
    <div id="dream-text"></div>
    <div id="dream-more">click or space to continue</div>
  </div>

  <!-- menu / victory / defeat -->
  <div id="overlay"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
