<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KINAETO — Beneath the Flame</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🜏</text></svg>" />
  <link rel="preload" href="vendor/fonts/uncial-antiqua-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <!-- Cache-buster: bump GAME_VERSION on every release. It stamps ?v= onto the
       stylesheet and every module URL via the import map, so browsers fetch
       fresh copies the moment this file updates (GitHub Pages caches HTML for
       ~10 minutes; every asset behind it busts instantly). Game modules import
       each other through bare "#game/*" specifiers — resolved here in the
       browser, and by package.json "imports" for Node tests. -->
  <script>
    const GAME_VERSION = '2026-07-19-1';
    const GAME_MODULES = [
      'config', 'data', 'effects', 'battle', 'board', 'scene', 'units',
      'kinaeto', 'cards3d', 'hud', 'meta', 'tutorial', 'hub', 'main',
    ];
    const imports = { three: `./vendor/three.module.min.js?v=${GAME_VERSION}` };
    for (const m of GAME_MODULES) imports[`#game/${m}.js`] = `./src/${m}.js?v=${GAME_VERSION}`;
    document.write(`<script type="importmap">${JSON.stringify({ imports })}<\/script>`);
    document.write(`<link rel="stylesheet" href="style.css?v=${GAME_VERSION}" />`);
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- top bar: floating glowing text, no boxes -->
  <div id="topbar">
    <div class="top-group">
      <div id="hud-turn">Turn 1</div>
      <div id="hud-wave">Wave 0 / 4</div>
    </div>
    <div id="obelisk-wrap">
      <div id="hud-obelisk-text">OBELISK 20 / 20</div>
      <div id="obelisk-bar"><div id="hud-obelisk-fill"></div><div id="obelisk-segs"></div></div>
      <div id="hud-gaze"></div>
    </div>
    <div class="top-group right">
      <div id="hud-deck">Deck 0</div>
      <div id="hud-discard">Discard 0</div>
    </div>
  </div>

  <!-- resources: Impetus flames + the single Kinaetic focus -->
  <div id="resources">
    <div id="impetus-label">IMPETUS</div>
    <div id="hud-impetus"></div>
    <div id="kinaetic-wrap" title="Kinaetic focus — one reach of the hand per turn">
      <svg id="hud-kinaetic" viewBox="0 0 64 40" width="58" height="36">
        <path d="M4 20 Q32 -6 60 20 Q32 46 4 20 Z" fill="none" stroke="currentColor" stroke-width="3"/>
        <circle cx="32" cy="20" r="9" fill="currentColor"/>
        <circle cx="32" cy="20" r="3.5" fill="#050208"/>
      </svg>
      <div id="kinaetic-label">KINAETIC</div>
    </div>
  </div>
  <button id="btn-endturn">END TURN</button>

  <!-- transient messaging -->
  <div id="banner"></div>
  <div id="toast"></div>
  <div id="hint"></div>

  <!-- drag drop-zones: USE (right edge) and BURN (by the impetus flames) -->
  <div id="zone-use">
    <div class="zone-ring">◎</div>
    <div class="zone-label">USE</div>
    <div class="zone-sub">drop the card here,<br/>then choose a tile</div>
  </div>
  <div id="zone-burn">
    <div class="zone-ring">🜂</div>
    <div class="zone-label">BURN</div>
    <div class="zone-sub">any card · +1 impetus</div>
  </div>

  <!-- unit hover tooltip + click-to-inspect card -->
  <div id="unit-tip"></div>
  <div id="inspect">
    <img id="inspect-card" alt="" draggable="false" />
    <div id="inspect-intent"></div>
    <div id="inspect-close">click anywhere to close</div>
  </div>

  <!-- Kinaeto dialogue -->
  <div id="dialogue">
    <div id="dialogue-name">◉ KINAETO</div>
    <div id="dialogue-text"></div>
    <div id="dialogue-more">click or space to continue</div>
  </div>

  <!-- hub panels: card altar / smith forge / the war map -->
  <div id="panel"></div>

  <!-- the Inquisitor's Judgement: a blinding burst of holy light -->
  <div id="flash"></div>

  <!-- the dream: the only room they cannot burn -->
  <div id="dream">
    <div id="dream-eye">
      <svg viewBox="0 0 64 40" width="120" height="76">
        <path d="M4 20 Q32 -6 60 20 Q32 46 4 20 Z" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <circle cx="32" cy="20" r="9" fill="currentColor"/>
        <circle cx="32" cy="20" r="3.5" fill="#050208"/>
      </svg>
    </div>
    <div id="dream-name">◉ KINAETO — IN THE DREAM</div>
    <div id="dream-text"></div>
    <div id="dream-more">click or space to continue</div>
  </div>

  <!-- menu / victory / defeat -->
  <div id="overlay"></div>

  <!-- entry point goes through the import map so it gets the version stamp -->
  <script type="module">import '#game/main.js';</script>
</body>
</html>
